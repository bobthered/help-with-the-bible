<!doctype html>
<html lang="en" data-color="gold" data-theme="light" class="motion-safe:scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#ffffff" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Bible Help" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
		<meta name="text-scale" content="scale" />
		<script>
			(() => {
				let mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				try {
					const saved = localStorage.getItem('theme');
					if (saved === 'dark' || saved === 'light') mode = saved;
				} catch {}
				document.documentElement.dataset.theme = mode;
				document.querySelector('meta[name="theme-color"]').content =
					mode === 'dark' ? '#0a0a0a' : '#ffffff';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
