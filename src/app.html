<!doctype html>
<html
	lang="en"
	data-color="gold"
	data-theme="light"
	class="touch-pan-x touch-pan-y motion-safe:scroll-smooth [&.lenis]:scroll-auto"
>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#ffffff" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Bible Help" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
		<meta name="text-scale" content="scale" />
		<script>
			(() => {
				document.documentElement.toggleAttribute(
					'data-app-mode',
					matchMedia('(display-mode: standalone)').matches || Boolean(navigator.standalone)
				);
				let mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				try {
					const saved = localStorage.getItem('theme');
					if (saved === 'dark' || saved === 'light') mode = saved;
				} catch {}
				document.documentElement.dataset.theme = mode;
				document.querySelector('meta[name="theme-color"]').content =
					mode === 'dark' ? '#0a0a0a' : '#ffffff';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body
		class="m-0 touch-pan-x touch-pan-y bg-surface p-[env(safe-area-inset-top)_env(safe-area-inset-right)_env(safe-area-inset-bottom)_env(safe-area-inset-left)] font-sans text-base text-foreground selection:bg-primary-200 selection:text-gray-950 motion-reduce:[&_*]:animate-none! motion-reduce:[&_*]:scroll-auto! motion-reduce:[&_*]:transition-none! [&_:focus-visible]:outline-2 [&_:focus-visible]:outline-offset-4 [&_:focus-visible]:outline-accent [&_input]:text-base [&_select]:text-base [&_textarea]:text-base"
		data-sveltekit-preload-data="hover"
	>
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
